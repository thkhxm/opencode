# PunkcodeAI 桌面端打包（GitLab CI/CD，自托管 GitLab + 自托管 Mac/Win runner）。
# 与 GitHub Actions 的 .github/workflows/punkcode-desktop.yml 等价。
# imagegen 已 vendor 进本仓（packages/desktop/skills/imagegen），无需 checkout sub2api，单仓即可构建。
#
# 触发：推 tag `desktop-v*`，或在 GitLab Web UI 手动 Run pipeline（Build → Pipelines → Run pipeline）。
# 前提：注册带 tag 的 shell executor runner ——
#   - 一台 Mac 打 `macos` 标签（需 bun / git / xcode-select --install）；
#   - 一台 Windows 打 `windows` 标签（需 bun / git）。
# 产物作为 job artifacts；tag 构建通过 deploy:updates 自动发布到自建 /updates。
#
# deploy:updates 需要在 GitLab CI/CD Variables 配置：
#   - PUNKCODE_UPDATE_HOST：更新服务器 host
#   - PUNKCODE_UPDATE_USER：SSH 用户
#   - PUNKCODE_UPDATE_REMOTE_DIR：服务器上的 updates 根目录
#   - PUNKCODE_UPDATE_SSH_PRIVATE_KEY：部署 SSH 私钥
#   - PUNKCODE_UPDATE_SSH_HOST_KEY：可选，known_hosts 行；不填时用 accept-new
#   - PUNKCODE_UPDATE_PUBLIC_URL：可选，默认 https://punkcodeai.myverse.site/updates

stages:
  - build
  - deploy

variables:
  PUNKCODE_CHANNEL: "prod"
  GIT_DEPTH: "1"
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  npm_config_electron_mirror: "https://npmmirror.com/mirrors/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

# 仅在打 desktop-v* tag 或 Web 手动触发时跑（避免每次 push 都构建）
.desktop_rules: &desktop_rules
  rules:
    - if: '$CI_COMMIT_TAG =~ /^desktop-v/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

build:mac:
  stage: build
  <<: *desktop_rules
  tags: [macos] # 落到你的 Mac self-hosted runner（shell executor）
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  script:
    - bun install
    - cd packages/desktop
    - mkdir -p native
    - bun run build
    - bun run package:mac
  artifacts:
    name: "desktop-mac-arm64"
    when: always
    paths:
      - packages/desktop/dist/*.dmg
      - packages/desktop/dist/*.zip
      - packages/desktop/dist/*.blockmap
      - packages/desktop/dist/latest-mac.yml
    expire_in: 2 weeks

build:win:
  stage: build
  <<: *desktop_rules
  tags: [windows] # 落到你的 Windows self-hosted runner（shell executor，默认 PowerShell）
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  script:
    - bun install
    - cd packages/desktop
    - if (!(Test-Path native)) { New-Item -ItemType Directory native | Out-Null }
    - bun run build
    - bun run package:win
  artifacts:
    name: "desktop-win-x64"
    when: always
    paths:
      - packages/desktop/dist/*.exe
      - packages/desktop/dist/*.blockmap
      - packages/desktop/dist/latest.yml
    expire_in: 2 weeks

deploy:updates:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG =~ /^desktop-v/'
  tags: [macos]
  needs:
    - job: build:mac
      artifacts: true
    - job: build:win
      artifacts: true
  script:
    - python3 packages/desktop/scripts/publish-updates-gitlab.py
