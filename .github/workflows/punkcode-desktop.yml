# PunkcodeAI 桌面端打包（fork 专属，与上游 sst/opencode 的 workflow 无关）。
#
# 在 GitHub 托管 runner 上同时打 macOS(arm64) 与 Windows(x64) 包：
#   - macOS  : macos-14 (Apple Silicon) → dmg + zip（未签名 + ad-hoc，内部使用）
#   - Windows: windows-latest (x64)     → nsis 安装版 + portable 便携版（未签名）
# 产物作为 artifacts 上传，下载后用 deploy/publish-desktop-update*.* 发布到自建 /updates。
#
# 触发：Actions 页手动 Run（可选 channel），或推 tag `desktop-v*`。
# 前提：fork 仓需在 Settings → Actions 里启用 workflow。公开仓 runner 免费。
name: 桌面端打包

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "发布渠道 (prod/beta/dev)"
        type: choice
        options: [prod, beta, dev]
        default: prod
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    name: 打包 ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 默认覆盖 Apple Silicon + 主流 Windows；要加 Intel mac 用 macos-13/platform mac，要加 win arm64 另配。
          - os: macos-14
            platform: mac
            artifact: desktop-mac-arm64
          - os: windows-latest
            platform: win
            artifact: desktop-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      # opencode（桌面端本体）——用触发分支/标签的代码。imagegen 已 vendor 进本仓，无需再 checkout sub2api。
      - name: Checkout opencode
        uses: actions/checkout@v4
        with:
          path: opencode

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        working-directory: opencode
        run: bun install

      # native（mac 原生窗口模块）当前为空目录且未纳入 git；建空目录让 extraResources 的 from: native/ 不报错。
      # 注意：mac 原生窗口特性(毛玻璃/自定义标题栏)会缺失，但 app 可正常构建与运行。
      - name: 占位 native 目录
        working-directory: opencode/packages/desktop
        shell: bash
        run: mkdir -p native

      - name: 构建（renderer + sidecar）
        working-directory: opencode/packages/desktop
        env:
          PUNKCODE_CHANNEL: ${{ github.event.inputs.channel || 'prod' }}
        run: bun run build

      - name: 打包（${{ matrix.platform }}，未签名）
        working-directory: opencode/packages/desktop
        env:
          PUNKCODE_CHANNEL: ${{ github.event.inputs.channel || 'prod' }}
        run: bun run package:${{ matrix.platform }}

      - name: 上传产物 (Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            opencode/packages/desktop/dist/*.dmg
            opencode/packages/desktop/dist/*.zip
            opencode/packages/desktop/dist/*.exe
            opencode/packages/desktop/dist/*.blockmap
            opencode/packages/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # tag 触发时把两端平台包挂到 GitHub Release（Release 页就能直接下载 dmg/exe/zip，
  # 不必去 Actions 的 Artifacts 里找；workflow_dispatch 手动跑则只产 Artifacts、不发 Release）。
  release:
    name: 发布 Release（附平台包）
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载两端产物
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 创建/更新 Release 并附 dmg/exe/zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find dist -type f)
          echo "附件:"; echo "$files"
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" $files --clobber --repo "${{ github.repository }}"
          else
            gh release create "${{ github.ref_name }}" $files \
              --repo "${{ github.repository }}" \
              --title "PunkcodeAI Desktop ${{ github.ref_name }}" \
              --notes "macOS(arm64) + Windows(x64) 未签名内部版。自动更新走自建 /updates。"
          fi
